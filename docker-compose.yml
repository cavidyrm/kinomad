# Traefik routes by domain; the host port is for direct IP access (preview / before DNS).
#
#   Domain:  https://ironpulse.com
#   Direct:  http://<server-ip>:3007
#
# On the server: copy to APP_DIR (e.g. /opt/ironpulse). Set GitHub secret APP_DIR to the same path.
services:
  app:
    image: ghcr.io/cavidyrm/ironpulse:latest
    container_name: ironpulse
    restart: unless-stopped
    ports:
      - "3007:80"
    networks:
      - traefik-public
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-public"
      - "traefik.http.services.ironpulse.loadbalancer.server.port=80"
      - "traefik.http.routers.ironpulse.rule=Host(`ironpulse.com`) || Host(`www.ironpulse.com`)"
      - "traefik.http.routers.ironpulse.entrypoints=websecure"
      - "traefik.http.routers.ironpulse.tls=true"
      - "traefik.http.routers.ironpulse.tls.certresolver=myresolver"
      - "traefik.http.routers.ironpulse-http.rule=Host(`ironpulse.com`) || Host(`www.ironpulse.com`)"
      - "traefik.http.routers.ironpulse-http.entrypoints=web"
      - "traefik.http.routers.ironpulse-http.middlewares=ironpulse-redirect-https"
      - "traefik.http.middlewares.ironpulse-redirect-https.redirectscheme.scheme=https"

networks:
  traefik-public:
    external: true
