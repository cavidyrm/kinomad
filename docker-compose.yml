# One-command deploy for the whole stack.
#
# The frontend image is built from this folder's Dockerfile (the repo's CI already
# publishes it to ghcr.io/cavidyrm/kinomad-frontend:latest — use `image:` for the
# published build, or `build:` while iterating on the server).
#
#   docker compose --env-file .env up -d --build
#
# Service names matter: nginx.conf proxies to `kinomad-api` and `kinomad-demo` by
# name, so renaming a service here breaks /api and /demo.

services:
  web:
    build: .
    # image: ghcr.io/cavidyrm/kinomad-frontend:latest
    container_name: kinomad-web
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      api:
        condition: service_healthy
    networks: [kinomad]

  api:
    image: ${API_IMAGE:-ghcr.io/cavidyrm/kinomad-api:latest}
    container_name: kinomad-api
    restart: unless-stopped
    environment:
      PORT: "8080"
      DATABASE_URL: postgres://${PGUSER}:${PGPASSWORD}@db:5432/${PGDATABASE}?sslmode=disable
      # Session signing key. Generate once: openssl rand -hex 32
      SESSION_SECRET: ${SESSION_SECRET}
      # Comma-separated list of addresses allowed to sign in to /admin.
      ADMIN_EMAILS: ${ADMIN_EMAILS}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-https://kinomadstudio.com}
      # Where uploaded shots and hosted bundles are written.
      STORAGE_DIR: /var/lib/kinomad
    volumes:
      - api_storage:/var/lib/kinomad
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 12
    networks: [kinomad]

  # Serves the hosted client bundles the CRM publishes. nginx maps /demo/<slug>/
  # onto this container, so no separate DNS record is needed.
  demo:
    image: ${DEMO_IMAGE:-ghcr.io/cavidyrm/kinomad-demo:latest}
    container_name: kinomad-demo
    restart: unless-stopped
    volumes:
      - api_storage:/var/lib/kinomad:ro
    networks: [kinomad]

  db:
    image: postgres:16-alpine
    container_name: kinomad-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PGUSER}
      POSTGRES_PASSWORD: ${PGPASSWORD}
      POSTGRES_DB: ${PGDATABASE}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PGUSER} -d ${PGDATABASE}"]
      interval: 10s
      timeout: 3s
      retries: 12
    networks: [kinomad]

volumes:
  db_data:
  api_storage:

networks:
  kinomad:
