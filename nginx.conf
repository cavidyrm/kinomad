server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    location = / { try_files /index.html =404; }

    # Single-page site: every section is an anchor on index.html. Serve the nav
    # anchors as clean URLs too, so /pricing in an ad or an email lands somewhere.
    location = /programs { return 301 /#programs; }
    location = /trainers { return 301 /#trainers; }
    location = /pricing  { return 301 /#pricing; }
    location = /schedule { return 301 /#schedule; }
    location = /contact  { return 301 /#contact; }

    # No SPA fallback. A missing asset must return a real 404, not 200-with-HTML —
    # a 200 HTML response served in place of a .js or .css file turns a deploy
    # mistake into an unexplained runtime error.
    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
    location = /404.html { internal; }

    # HTML must not be cached: a stale page can outlive the stylesheet or script
    # it depends on, which is how a half-updated deploy looks like a broken site.
    location ~* \.html$ {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location ~* \.(js|css|svg|ico|woff2?|png|jpg|jpeg|webp|mp4|webm)$ {
        expires 7d;
        add_header Cache-Control "public";
    }

    location = /robots.txt  { expires 1d; add_header Cache-Control "public"; }
    location = /sitemap.xml { expires 1d; add_header Cache-Control "public"; }

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
