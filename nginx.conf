server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # ─── Clean URLs ────────────────────────────────────────────────────────────
    # The pages are flat files with spaces in their names. These rewrites give the
    # public the documented URLs without renaming anything. km-routes.js holds the
    # same table on the client and rewrites the pages' own links to match.

    location = / { try_files /index.html =404; }

    location = /works    { try_files "/Kinomad Works.dc.html" =404; }
    location = /reels    { try_files /reels.html =404; }
    location = /privacy  { try_files "/Kinomad Privacy.dc.html" =404; }

    # Depth-safe subresources MUST come before typed detail routes — otherwise
    # /website/support.js matches ^/website/[^/]+ and serves HTML as JavaScript.
    #
    # Any depth, not just one level: the pages reference "./km-api.js" and
    # "assets/…" relatively, so /brand/vantar resolves them under /brand/ but
    # /brand/vantar/ resolves them a level deeper. Both must land at the root.
    # /api/ and /demo/ are excluded so their proxies keep their own files, and
    # root-level /assets/… is excluded so it is served normally.
    location ~ ^/(?!api/|demo/|assets/).+/(assets/[^?]+)$ { try_files /$1 =404; }
    location ~ ^/(?!api/|demo/|assets/).+/([^/]+\.(?:js|css|svg|png|jpe?g|webp|woff2?|ico|mp4|webm))$ { try_files /$1 =404; }

    # Project detail — slug segment must not contain a dot (excludes *.js requests).
    location = /website { try_files "/Kinomad Website Page.dc.html" =404; }
    location = /brand   { try_files "/Kinomad Brand Page.dc.html" =404; }
    location = /motion  { try_files "/Kinomad Motion Page.dc.html" =404; }

    location ~ ^/website/[^/.]+/?$ { try_files "/Kinomad Website Page.dc.html" =404; }
    location ~ ^/brand/[^/.]+/?$   { try_files "/Kinomad Brand Page.dc.html" =404; }
    location ~ ^/motion/[^/.]+/?$  { try_files "/Kinomad Motion Page.dc.html" =404; }

    # ─── API (Go backend) — ^~ stops regex locations from stealing /api/assets/… ─
    location ^~ /api/ {
        proxy_pass http://kinomad-api:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_pass_header Set-Cookie;
        client_max_body_size 520M;
    }

    location /health {
        proxy_pass http://kinomad-api:8080/health;
    }

    # ─── Hosted client sites (demo-host container) ─────────────────────────────
    # Bundles are stored by the API and served by kinomad-demo. Use /demo/<slug>/
    # on the main domain so no separate demo.* DNS record is required.
    location = /demo {
        return 301 /demo/;
    }

    # Trailing slash keeps `./support.js` on the proxied demo bundle path.
    location ~ ^/demo/(?<slug>[a-z0-9-]+)$ {
        return 301 /demo/$slug/;
    }

    location ~ ^/demo/(?<slug>[a-z0-9-]+)(?<path>/.*)?$ {
        proxy_pass http://kinomad-demo/$slug$path$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "no-store" always;
    }

    # ─── Admin ─────────────────────────────────────────────────────────────────
    # Sign-in is the only unauthenticated admin route. The CRM is gated by the
    # session the API issues; once the backend exists, protect /admin here too
    # (auth_request against the session endpoint) so an unauthenticated request
    # never reaches the HTML. See DEPLOY.md for a basic-auth stopgap.
    location = /admin       { try_files "/Kinomad CRM.dc.html" =404; }
    location = /admin/login { try_files "/Kinomad CRM Sign In.dc.html" =404; }

    # ─── Everything else ───────────────────────────────────────────────────────
    # Direct filename URLs keep working — the design-tool files link that way and
    # km-routes.js only rewrites them when served from a host.
    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
    location = /404.html { internal; }

    # HTML must not be cached: a stale page can outlive the script it depends on,
    # which is how a half-updated deploy shows up as a missing global at runtime.
    location ~* \.html$ {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location ~* \.(js|jsx|css|svg|ico|woff2?|png|jpg|jpeg|webp|mp4|webm)$ {
        expires 7d;
        add_header Cache-Control "public";
    }

    # The CRM is internal. Keep it out of search results.
    location ~* ^/(admin|Kinomad%20CRM) {
        add_header X-Robots-Tag "noindex, nofollow" always;
    }
}
